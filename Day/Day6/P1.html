<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Align-item|Align-content|flex-wrap</title>
    <style>
    .container1{
       display: flex;
       border: 3px solid red;
       gap: 10px;
       padding: 10px;
       align-items: center;
       margin-top: 20px;
       height: 20px;
    }
    .container2{
        display: flex;
       border: 3px solid red;
       gap: 10px;
       padding: 10px;
       margin-top: 20px;
       /* wrap | nowrap */
       flex-wrap: wrap;
       /* center | space-around | space-between | space-evenly | flex-start | flex-end*/
       align-content:stretch;
       height: 300px;
    }
    .Item2{
        background-color: brown;
        color:beige;
        padding:15px;
    }
    </style>
</head>
<body>
    <!-- align items -->
    <div class="container1">
        <div class="Item">Item 1</div>
        <div class="Item">Item 2</div>
        <div class="Item">Item 3</div>
    </div>
    <!-- flex wrap -->
    <div class="container2">
        <div class="Item2">Item 1</div>
        <div class="Item2">Item 2</div>
        <div class="Item2">Item 3</div>
        <div class="Item2">Item 4</div>
        <div class="Item2">Item 5</div>
        <div class="Item2">Item 6</div>
    </div>

</body>
</html>
