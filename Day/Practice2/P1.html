<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard</title>
</head>
<body>
    <h1 id="title">Student Dashboard</h1>
    <h2>student Information</h2>
    <p id="name">Name:Sanvi</p>
    <p id="Cource">Cource:Computer Science</p>
    <p id="semester">Semester:2</p>

    <h2>Subjects</h2>

    <p class="subject">HTML</p>
    <p class="subject">CSS</p>
    <p class="subject">JavaScript</p>
    <p class="subject">C Programming</p>

    <button id="profileBtn">View Profile</button>
    <button id="highlightBtn">Highlight Subjects</button>
    <button id="messageBtn">Show Message</button>

    <div id="message"></div>

     <script>
        // 1. View Profile
        const title = document.getElementById("title");
        const name = document.getElementById("name");
        const course = document.getElementById("course");
        const semester = document.getElementById("semester");

        const profileBtn = document.getElementById("profileBtn");

        profileBtn.onclick = function() {

            title.textContent = "My Student Profile";

            title.style.color = "blue";

            name.textContent = "Name: Sanvi R Rao";

            course.style.backgroundColor = "lightyellow";

            semester.style.backgroundColor = "lightgreen";
        };

        // Highlight Subjects

           const subjects = document.querySelectorAll(".subject");

        const highlightBtn = document.getElementById("highlightBtn");

        highlightBtn.onclick = function() {

            subjects.forEach(function(subject) {

                subject.style.backgroundColor = "lightblue";

                subject.style.color = "darkblue";

                subject.style.width = "200px";

                subject.style.padding = "10px";

                subject.style.border = "2px solid blue";

            });

        };

        // Show message

         const messageBtn = document.getElementById("messageBtn");

        const message = document.getElementById("message");

        messageBtn.onclick = function() {

            message.innerHTML = `
                <h3>Keep Learning!</h3>
                <p>You are doing great. Continue practicing JavaScript.</p>
            `;

            message.style.backgroundColor = "lightgreen";

            message.style.padding = "15px";

            message.style.border = "2px solid green";

            message.style.marginTop = "20px";
        };

        //getElementsByClassName()
          const subjectList = document.getElementsByClassName("subject");

        console.log("Number of subjects:", subjectList.length);

        //getElementsByTagName()
         const paragraphs = document.getElementsByTagName("p");

        console.log("Number of paragraphs:", paragraphs.length);

        //querySelector()
          const heading = document.querySelector("h1");

        console.log("Heading:", heading.innerText);
    </script>
</body>
</html>
