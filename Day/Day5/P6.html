<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> CSS Flexbox|Display|Flex Direction|Justify-content</title>
    <style>
        .container{
            display: flex;
            border: 3px solid brown;
            gap: 15px;
            padding: 15px;
        }
        .item{
            background-color: blanchedalmond;
            color: brown;
            padding:15px;
        }
        .container2{
            display: flex;
            border: 3px solid brown;
            gap: 10px;
            padding: 10px;
            /* column | row | row-reverse | column-reverse*/
            flex-direction: column-reverse; 
            margin-top: 20px;
        }
        .container3{
            display: flex;
            border: 3px solid red;
            gap: 10px;
            padding: 10px;
            /* center | space-around | space-between | space-evenly | flex-start | flex-end*/
            justify-content: space-around;
        }
        .Item{
            background-color: green;
            color: cornsilk;
            padding: 15px;
        }
    </style>
</head>
<body>
    <p>CSS Flexbox:is a one dimensional layout system designed to arange and align items in a container, either in a row or a column.It makes much easier to create responsive, flexible layouts without comples positioning or floats.</p>
    <div class="container">
        <div class="item">Item1</div>
        <div class="item">Item2</div>
        <div class="item">Item3</div>
    </div>
    <!-- flex-direction -->
    <div class="container2">
        <div class="item">Item 1</div>
        <div class="item">Item 2</div>
        <div class="item">Item 3</div>
    </div>
    <!-- Justify content -->
    <div class="container3">
        <div class="Item">Item 1</div>
        <div class="Item">Item 2</div>
        <div class="Item">Item 3</div>
    </div>
</body>
</html>
