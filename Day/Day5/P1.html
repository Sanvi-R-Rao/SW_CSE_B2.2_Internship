<!DOCTYPE html>
<html lang="en">
<head>

    <title>CSS Selectors|Grouping Selector, Descendant Selectors & Child Selector</title>
    <style>
        h1,h2,h3{
            color: rgb(78, 13, 153);

        }
        div p{
            color: rgb(184, 52, 47);
            font-family: Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif;
        }
        ul > li{
            list-style-type: square;
            color:rgb(232, 114, 114) ;
        }
    </style>
</head>
<body>
    <!-- Grouping Selector -->
    <h1>Frontend Development</h1>

    <!-- Descendant Selector -->
    <div>
        <p>This paragraph here is to depict the use of Descendant selector</p>
    </div>
    <p>This is a normal paragraph</p>

    <!-- Child Selector -->
     <p>Child Selector</p>
     <p>Selectors</p>
     <ul>
        <li>Element selector</li>
        <li>Grouping selectors</li>
        <li>Child selector</li>
        <li>many more...</li>
     </ul>

</html>
