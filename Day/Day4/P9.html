<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Selecters</title>
    <style>
        .Style1{
            font-size:40px;
            color:brown;
            background-color: blanchedalmond;
        }
        .Style2{
            color:blueviolet;
            
        }
        .Style3{
            font-size: 24px;
            font-weight: bold;
            font-family: 'Courier New', Courier, monospace;
        }
    </style>
</head>
<body>
    <h1 class="Style1">Class Selector</h1>
    <h1 class="Style2">Heading tag itself, but a different style</h1>
    <p class="Style3">This is a paragraph that I have created</p>
    <p class="Style2">This ia second paragraph</p>
</body>
</html>
