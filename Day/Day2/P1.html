<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image tag</title>
</head>
<body>
    <img src="dog.png" alt="The image of dog" width="500px" height="500px">
    <!-- src:source | alt:alternative -->
    <!--Image type:jpeg/jpg|png|webp|gif  -->

    <!-- Title-tooltip text -->
    <img src="dog.png" alt="The image of dog" title="My name is Tommy">

    <!-- Relative image src -->
    <img src="/SW_CSE_B2.2_Internship/Day/Day2/dog.png" alt="This is a dog">

    <!--Content Delivery Network/remote server -->
    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSZtmcKMAebCm9m1vdU5CJvbCUKMNLnaw3IRw&s" alt="This is a dog">
